name: Cypress Tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  Slack-Notification:
    runs-on: ubuntu-latest
    steps:
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@master
        if: always()
        env:
          SLACK_ICON_EMOJI: ':robot_face:'
          SLACK_USERNAME: Cypress Bot
          SLACK_MESSAGE: E2E tests are now running. Stay tuned for updates!
          SLACK_TITLE: 'Cypress'
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Setup Icons
        run: npm config set '//npm.fontawesome.com/:_authToken' "${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare Icons
        run: pnpm prepare-pro-icons
      - name: Build Project
        run: pnpm build-devnet
        env:
          CI: false
          VITE_APP_MARKERS_API_URL: ${{ secrets.MARKERS_API_URL }}
          VITE_APP_VERSION_URL: ${{ secrets.APP_VERSION_URL }}
      - name: Block robots on integration deploy
        run: |
          printf 'User-agent: *\nDisallow: /\n' > ./build/robots.txt
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: 'us-east-1'
      - name: Deploy to S3 bucket
        run: aws s3 sync ./build/ s3://${{ secrets.AWS_S3_BUCKET_INTEGRATION }} --delete
      - name: No-cache index.html
        run: aws s3 cp s3://${{ secrets.AWS_S3_BUCKET_INTEGRATION }}/index.html s3://${{ secrets.AWS_S3_BUCKET_INTEGRATION }}/index.html --metadata-directive REPLACE --cache-control max-age=0,no-cache,no-store,must-revalidate --content-type text/html --acl public-read

  cypress-run:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Setup Icons
        run: npm config set '//npm.fontawesome.com/:_authToken' "${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download failed specs from previous attempt
        if: ${{ github.run_attempt > 1 }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: failed-specs-attempt-${{ github.run_attempt - 1 }}
      - name: Select specs to run
        id: select-specs
        run: |
          if [ -s failed-specs.txt ]; then
            echo "Re-running only the specs that failed on attempt $(( ${{ github.run_attempt }} - 1 )):"
            cat failed-specs.txt
            echo "spec=$(paste -sd, failed-specs.txt)" >> "$GITHUB_OUTPUT"
          else
            echo 'No previous failures recorded, running the full suite.'
          fi
      - name: Cypress run
        uses: cypress-io/github-action@v4
        with:
          command: pnpm cy:run
        env:
          E2E_SPEC: ${{ steps.select-specs.outputs.spec }}
      - name: Uploading failed specs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-specs-attempt-${{ github.run_attempt }}
          path: failed-specs.txt
          if-no-files-found: ignore
      - name: Uploading artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-execution-report-attempt-${{ github.run_attempt }}
          path: |
            mochawesome-report/mochawesome.html
            cypress/screenshots
            cypress/videos
